        <button

    <!-- نقطة دخول React القياسية الوحيدة -->
    <script type="module" src="/src/main.tsx"></script>

    <script>
      (function () {
        // ——— 1. Service Worker Migration (تنظيف SW القديم مرة واحدة) ———
        try {
          var MIGRATION_KEY = 'imam_pwa_migration_v13_clean';
          var forceReset = window.location.search.indexOf('reset_cache=1') !== -1;
          if (!localStorage.getItem(MIGRATION_KEY) || forceReset) {
            localStorage.setItem(MIGRATION_KEY, '1');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                regs.forEach(function (reg) {
                  var scriptUrl = (reg.active && reg.active.scriptURL) || '';
                  if (forceReset || scriptUrl.indexOf('sw-push.js') === -1) {
                    reg.unregister();
                  }
                });
              }).catch(function () {});
            }
            if (window.caches && typeof window.caches.keys === 'function') {
              window.caches.keys().then(function (names) {
                names.forEach(function (name) {
                  if (name.indexOf('quran-') === -1) {
                    window.caches.delete(name);
                  }
                });
              }).catch(function () {});
            }
          }
        } catch (e) {
          // ignore storage access errors
        }

        // ——— 2. Suppress benign Vite HMR WebSocket errors ———
        window.addEventListener('unhandledrejection', function (ev) {
          var reasonStr = String((ev && ev.reason && (ev.reason.message || ev.reason)) || '');
          if (
            reasonStr.indexOf('WebSocket closed without opened') !== -1 ||
            reasonStr.indexOf('vite') !== -1
          ) {
            ev.preventDefault();
          }
        });

        // ——— 3. Rescue Button: يظهر بعد 5 ثوانٍ إذا لم يُحمَّل React ———
        setTimeout(function () {
          if (!window.__AL_IMAM_APP_MOUNTED__) {
            var btn = document.getElementById('imam-splash-rescue-btn');
            if (btn) btn.style.display = 'inline-block';
          }
        }, 5000);
      })();
    </script>
