  <body class="bg-[#f6f7f2] text-[#14281d] antialiased selection:bg-[#145a3a] selection:text-white">
    <div id="root"></div>
    <script>
      (function () {
        // Clean up any stale cached Firebase Auth tokens in IndexedDB/localStorage
        // that could trigger securetoken.googleapis.com errors on boot
        try {
          for (var i = localStorage.length - 1; i >= 0; i--) {
            var k = localStorage.key(i);
            if (k && k.indexOf('firebase:') === 0) {
              localStorage.removeItem(k);
            }
          }
          for (var j = sessionStorage.length - 1; j >= 0; j--) {
            var sk = sessionStorage.key(j);
            if (sk && sk.indexOf('firebase:') === 0) {
              sessionStorage.removeItem(sk);
            }
          }
          if (window.indexedDB && typeof window.indexedDB.deleteDatabase === 'function') {
            window.indexedDB.deleteDatabase('firebaseLocalStorageDb');
          }
        } catch (e) {
          // ignore storage access errors
        }

        // Always unregister any stale root service worker and clear old script caches
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            regs.forEach(function (reg) {
              reg.unregister();
            });
          }).catch(function () {});
        }
        if (window.caches && typeof window.caches.keys === 'function') {
          window.caches.keys().then(function (names) {
            names.forEach(function (name) {
              if (name.indexOf('quran-') === -1) {
                window.caches.delete(name);
              }
            });
          }).catch(function () {});
        }
      })();
    </script>
